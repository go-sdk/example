# yaml-language-server: $schema=https://www.schemastore.org/buf.gen.json
version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/go-sdk/example/gen
    - file_option: go_package
      value: github.com/go-sdk/server/options
      module: buf.build/go-sdk/server
      path: options.proto
  disable:
    - module: buf.build/googleapis/googleapis
    - module: buf.build/bufbuild/protovalidate
    - module: buf.build/grpc-ecosystem/grpc-gateway
plugins:
  - local: protoc-gen-go
    out: .
    opt: module=github.com/go-sdk/example
  - local: protoc-gen-go-grpc
    out: .
    opt: module=github.com/go-sdk/example
  - local: protoc-gen-grpc-gateway
    out: .
    opt: module=github.com/go-sdk/example
  - local: protoc-gen-openapiv2
    out: openapi
    strategy: all
    opt:
      - allow_merge=true
      - merge_file_name=openapi
      - include_package_in_tags=true
      - openapi_naming_strategy=fqn
      - disable_default_errors=true
      - enums_as_ints=true
      - output_format=yaml
      - preserve_rpc_order=true
