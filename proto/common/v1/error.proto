syntax = "proto3";

package common.v1;

import "options/options.proto";

// ErrorCode 定义应用稳定的业务错误码，数字值写入响应 domain。
enum ErrorCode {
  // ERROR_CODE_UNSPECIFIED 表示未指定业务错误码。
  ERROR_CODE_UNSPECIFIED = 0;

  // ERROR_CODE_INVALID_CREDENTIALS 表示用户名或密码错误。
  ERROR_CODE_INVALID_CREDENTIALS = 1000001 [(server.options.enum_value).message = "invalid username or password"];
  // ERROR_CODE_PERMISSION_DENIED 表示当前用户缺少所需权限。
  ERROR_CODE_PERMISSION_DENIED = 1000002 [(server.options.enum_value).message = "permission denied"];
  // ERROR_CODE_CURRENT_USER_CANNOT_BE_DELETED 表示用户不能删除当前登录账号。
  ERROR_CODE_CURRENT_USER_CANNOT_BE_DELETED = 1000003 [(server.options.enum_value).message = "current user cannot be deleted"];
  // ERROR_CODE_ADMIN_ROLE_CANNOT_BE_DELETED 表示内置管理员角色不能删除。
  ERROR_CODE_ADMIN_ROLE_CANNOT_BE_DELETED = 1000004 [(server.options.enum_value).message = "administrator role cannot be deleted"];
  // ERROR_CODE_BUILTIN_PERMISSION_CANNOT_BE_DELETED 表示内置权限不能删除。
  ERROR_CODE_BUILTIN_PERMISSION_CANNOT_BE_DELETED = 1000005 [(server.options.enum_value).message = "built-in permission cannot be deleted"];
  // ERROR_CODE_INVALID_ROLE_IDS 表示请求包含不存在的角色标识。
  ERROR_CODE_INVALID_ROLE_IDS = 1000006 [(server.options.enum_value).message = "one or more roles do not exist"];
  // ERROR_CODE_INVALID_PERMISSION_IDS 表示请求包含不存在的权限标识。
  ERROR_CODE_INVALID_PERMISSION_IDS = 1000007 [(server.options.enum_value).message = "one or more permissions do not exist"];
  // ERROR_CODE_FILE_NOT_FOUND 表示文件元数据存在但存储内容不存在。
  ERROR_CODE_FILE_NOT_FOUND = 1000008 [(server.options.enum_value).message = "file {{.Name}} not found"];
  // ERROR_CODE_RECORD_NOT_FOUND 表示请求的数据库记录不存在。
  ERROR_CODE_RECORD_NOT_FOUND = 1000009 [(server.options.enum_value).message = "record not found"];
  // ERROR_CODE_RECORD_ALREADY_EXISTS 表示唯一记录已经存在。
  ERROR_CODE_RECORD_ALREADY_EXISTS = 1000010 [(server.options.enum_value).message = "record already exists"];
  // ERROR_CODE_RECORD_IN_USE 表示记录仍被其他数据引用。
  ERROR_CODE_RECORD_IN_USE = 1000011 [(server.options.enum_value).message = "record is in use"];
  // ERROR_CODE_INVALID_FILE_NAME 表示上传文件名不合法。
  ERROR_CODE_INVALID_FILE_NAME = 1000012 [(server.options.enum_value).message = "invalid file name"];
}
